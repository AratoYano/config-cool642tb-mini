manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

  projects:
    - name: zmk
      url: https://github.com/cormoran/zmk
      revision: v0.3-branch+dya
      # ⭕ シンプルな指定に戻し、構文エラー（Malformed）を回避します
      import: app/west.yml

    # ⭕ PMW3610センサー用の最新ZIP（Input Processor）対応ドライバを直接引き込み
    - name: zmk-driver-pmw3610
      url: https://github.com/inorichi/zmk-driver-pmw3610
      revision: main

    # ⭕ 本来エラーを引き起こす原因だったwidgetを「ダミーの公開URL」で上書きすることで
    # cormoran版ZMK本体からの認証要求を完全に中和（ブロック）します
    - name: zmk-rgbled-widget
      url: https://github.com/cormoran/zmk-rgbled-widget
      revision: main
