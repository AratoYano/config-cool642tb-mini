manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

  projects:
    # 1. ZMK本体（cormoran版）
    - name: zmk
      url: https://github.com/cormoran/zmk
      revision: v0.3-branch+dya
      # ⭕ importを「app」に変更し、不要な追加ウィジェットの自動巻き込みを遮断します
      import: app

    # 2. PMW3610最新ドライバ（直接指定）
    - name: zmk-driver-pmw3610
      url: https://github.com/inorichi/zmk-driver-pmw3610
      revision: main

    # 3. ZMK Studio連携用モジュール群（すべて公開URL直接指定にフラット化）
    - name: zmk-module-ble-management
      url: https://github.com/cormoran/zmk-module-ble-management
      revision: main

    - name: zmk-module-battery-history
      url: https://github.com/cormoran/zmk-module-battery-history
      revision: main

    - name: zmk-module-settings-rpc
      url: https://github.com/cormoran/zmk-module-settings-rpc
      revision: main

    - name: zmk-module-runtime-input-processor
      url: https://github.com/cormoran/zmk-module-runtime-input-processor
      revision: main

    - name: zmk-behavior-runtime-sensor-rotate
      url: https://github.com/cormoran/zmk-behavior-runtime-sensor-rotate
      revision: main
